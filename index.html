<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Credit Creatures</title>
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="img/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <meta name="theme-color" content="#5b3fc4">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/app.css">
  <script>
    // Apply the saved appearance and reading mode before the page draws (js/ui/settings.js).
    try {
      const s = JSON.parse(localStorage.getItem("credit-creatures:settings")) || {};
      if (s.appearance && s.appearance !== "system") document.documentElement.dataset.appearance = s.appearance;
      if (s.reading === "dyslexia") document.documentElement.dataset.reading = "dyslexia";
    } catch {}
  </script>
</head>
<body>
  <header id="topbar" class="topbar" hidden>
    <span class="brand"><svg class="ico" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 21h18M5 21V9l3 2V7l4-3 4 3v4l3-2v12"/><path d="M10 21v-5a2 2 0 0 1 4 0v5"/></svg> Credit Creatures</span>
    <button id="who" class="who" type="button" aria-label="Open your creature's cottage" hidden></button>
    <span class="topbar-actions">
      <button id="save-quit" class="secondary small" type="button">Save and quit</button>
      <button id="sign-out" class="link" type="button">Sign out</button>
    </span>
  </header>
  <div id="nudge" class="nudge" role="status" hidden></div>
  <main id="app" class="app">
    <section class="panel center"><p>Loading...</p></section>
  </main>
  <script type="module" src="js/app.js"></script>
</body>
</html>
