<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Credit Creatures</title>
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="img/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <meta name="theme-color" content="#5b3fc4">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/bestiary.css">
  <script>
    // Apply the saved appearance and reading mode before the page draws (js/ui/settings.js).
    try {
      const s = JSON.parse(localStorage.getItem("credit-creatures:settings")) || {};
      if (s.appearance && s.appearance !== "system") document.documentElement.dataset.appearance = s.appearance;
      if (s.reading === "dyslexia") document.documentElement.dataset.reading = "dyslexia";
      if (s.motion === "calm") document.documentElement.dataset.motion = "calm";
    } catch {}
  </script>
</head>
<body>
  <header id="topbar" class="topbar bst-scope bst-topbar" hidden>
    <a id="brand" class="brand" href="#/hub" aria-label="Credit Creatures: go Home" title="Credit Creatures: go Home"><svg class="ico" viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 21h18M5 21V9l3 2V7l4-3 4 3v4l3-2v12"/><path d="M10 21v-5a2 2 0 0 1 4 0v5"/></svg></a>
    <button id="chapter-chip" class="chapter-chip" type="button" hidden></button>
    <ul id="status" class="status-chips" aria-label="Your coins, Sparkle and XP" hidden></ul>
    <nav id="topnav" class="topnav" aria-label="Main" hidden>
      <button type="button" data-nav="wallet" popovertarget="wallet-pop"></button>
      <button type="button" data-nav="leaderboard"></button>
    </nav>
    <span class="topbar-actions">
      <span id="save-state" class="save-state" aria-live="polite"></span>
      <button id="sound-btn" class="icon-btn" type="button" data-sound="none" aria-label="Sound effects" aria-pressed="false"></button>
      <button id="settings-btn" class="icon-btn" type="button" aria-label="Account settings" title="Account settings"><svg class="ico" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3h.1a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8v.1a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
      <button id="sign-out" class="secondary small" type="button" title="Your game saves by itself as you play. This saves one last time and goes back to the title screen. You stay signed in.">Save and exit</button>
    </span>
  </header>
  <div id="wallet-pop" class="wallet-pop bst-scope" popover aria-label="Your wallet"></div>
  <div id="nudge" class="nudge" role="status" hidden></div>
  <main id="app" class="app">
    <div class="bestiary bst-loading"><p class="bst-margin" role="status">Opening the field guide...</p></div>
  </main>
  <footer id="bottombar" class="bottombar bst-scope bst-bottombar" hidden>
    <button id="who" class="who" type="button" aria-label="Open your creature's cottage" hidden></button>
    <button id="dock-btn" class="dock-btn" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="dock" hidden><svg class="ico" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 13h5l1.5 3h5L16 13h5"/><path d="M5 5h14l2 8v6H3v-6z"/></svg><span>Dock</span><b class="dock-count" aria-hidden="true"></b></button>
    <nav id="shortcuts" class="shortcuts" aria-label="Main places"></nav>
    <aside id="challenges" class="challenges" aria-label="Today's challenges" hidden></aside>
    <button id="things-btn" class="things-btn" type="button" aria-haspopup="dialog" title="Things To Do (press T)"><svg class="ico" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2 5-5 2 2-5z"/></svg><span>Things To Do</span></button>
    <section id="dock" class="dock" aria-label="Your Dock" hidden></section>
  </footer>
  <script type="module" src="js/app.js"></script>
</body>
</html>
