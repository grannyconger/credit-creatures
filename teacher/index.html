<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Credit Creatures Teacher</title>
  <link rel="icon" href="../img/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="../img/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="../img/apple-touch-icon.png">
  <meta name="theme-color" content="#5b3fc4">
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/app.css">
  <script>
    // Apply the saved appearance and reading mode before the page draws (js/ui/settings.js).
    try {
      const s = JSON.parse(localStorage.getItem("credit-creatures:settings")) || {};
      if (s.appearance && s.appearance !== "system") document.documentElement.dataset.appearance = s.appearance;
      if (s.reading === "dyslexia") document.documentElement.dataset.reading = "dyslexia";
    } catch {}
  </script>
</head>
<body>
  <main class="app teacher-page">
    <section class="panel">
      <header class="acct-head">
        <div>
          <h1>📣 Teacher Dashboard</h1>
          <p class="tagline">Credit Creatures classroom controls.</p>
        </div>
        <button id="sign-out" class="secondary" type="button" hidden>Sign out</button>
      </header>
      <div id="teacher" aria-live="polite"><p class="muted">Loading...</p></div>
    </section>
  </main>
  <script type="module" src="../js/teacher/dashboard.js"></script>
</body>
</html>
